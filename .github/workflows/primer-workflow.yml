name: Mi Primer Workflow de Automatizacion

on:
  push:
    branches:
      - main
    paths:
      - '**.js'

jobs:
  saludar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repo
        uses: actions/checkout@v4

      
      - name: Usando el Secret de forma segura
        env:
          MI_LLAVE_SECRETA: ${{ secrets.API_KEY }}
        run: |
          echo "Iniciando proceso seguro..."
          echo "El valor de la API KEY es: $MI_LLAVE_SECRETA"
